name: Comprobar el sitio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Comprobar lo que hay en el repositorio
        run: python comprobar.py

      - name: Generar la web desde cero (sin publicar) y volver a comprobar
        run: |
          pip install -r requirements.txt
          python build.py
          python comprobar.py
